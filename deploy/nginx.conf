# Nginx site config for the Peripheral Test Webapp
#
# Internal VM (Boxes/self-signed): use as-is with the self-signed cert
# generated by generate_self_signed_cert.sh.
#
# Hostinger (production): once you point a real domain at the server,
# run `sudo certbot --nginx -d yourdomain.com` - certbot will rewrite
# the ssl_certificate/ssl_certificate_key lines below to point at the
# Let's Encrypt cert automatically. Nothing else in this file needs to
# change.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;   # replace "_" with your real domain on Hostinger

    ssl_certificate     /etc/ssl/peripheral-test/selfsigned.crt;
    ssl_certificate_key /etc/ssl/peripheral-test/selfsigned.key;

    # Snapshot images are small (base64 JSON), but the admin tutorial
    # uploads can be full video files - keep the body limit generous and
    # extend the timeouts so a slow upload doesn't get cut off.
    client_max_body_size 2048M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /static/ {
        alias /opt/peripheral_test_app/static/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
