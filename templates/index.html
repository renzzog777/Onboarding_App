{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<h1 class="home-title">IT Onboarding Tools</h1>

<div class="home-menu">
    <a class="home-tile" href="{{ url_for('tests_start') }}">
        <svg class="home-tile-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="14" y="6" width="20" height="36" rx="10" stroke="currentColor" stroke-width="2"/>
            <line x1="24" y1="6" x2="24" y2="20" stroke="currentColor" stroke-width="2"/>
            <line x1="24" y1="14" x2="24" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="home-tile-label">Peripheral Tests</span>
        <span class="home-tile-desc">Test mouse, keyboard, headset &amp; webcam</span>
    </a>

    <a class="home-tile" href="{{ url_for('tutorials') }}">
        <svg class="home-tile-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 10c0-1.1.9-2 2-2h12v32H10a2 2 0 0 1-2-2V10Z" stroke="currentColor" stroke-width="2"/>
            <path d="M40 10c0-1.1-.9-2-2-2H26v32h12a2 2 0 0 0 2-2V10Z" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span class="home-tile-label">Tutorials</span>
        <span class="home-tile-desc">macOS setup guides &amp; videos</span>
    </a>
</div>
{% endblock %}
