<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Peripheral Test{% endblock %} - IT Onboarding Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">IT Onboarding Tools</a>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('tests_start') }}">Peripheral Tests</a>
            <a href="{{ url_for('tutorials') }}">Tutorials</a>
            {% if session.get('is_admin') %}
                <a href="{{ url_for('history') }}">History</a>
                <a href="{{ url_for('admin_resources') }}">Manage Tutorials</a>
                <a href="{{ url_for('admin_logout') }}">Log Out</a>
            {% else %}
                <a href="{{ url_for('admin_login') }}">Admin</a>
            {% endif %}
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">macOS peripheral testing &middot; mouse, keyboard, headset, webcam</footer>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
</body>
</html>
