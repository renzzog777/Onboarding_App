<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Onboarding Tests{% endblock %} - IT Onboarding Tools</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">IT Onboarding Tools</a>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('tests_start') }}">Onboarding Tests</a>
            <a href="{{ url_for('tutorials') }}">Tutorials</a>
            {% if session.get('is_admin') %}
                <a href="{{ url_for('history') }}">History</a>
                <a href="{{ url_for('admin_resources') }}">Manage Tutorials</a>
                <a href="{{ url_for('admin_logout') }}">Log Out</a>
            {% else %}
                <a href="{{ url_for('admin_login') }}">Admin</a>
            {% endif %}
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">macOS onboarding tests &middot; mouse, keyboard, headset, webcam, network</footer>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
</body>
</html>
